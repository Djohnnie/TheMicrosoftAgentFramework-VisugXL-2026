  <line x1="88" y1="120" x2="1832" y2="120" stroke="#2b3352" stroke-width="2"/>

  <g id="slide-content">
    <text x="88" y="235" fill="#ffffff" class="display" font-size="68">From explicit rules to learned representations</text>
    <text x="88" y="300" fill="#b6bccd" class="body" font-size="26">AI systems range from hand-written logic to models trained on data.</text>

    <g aria-label="Rules-based">
      <rect x="88" y="360" width="424" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
      <rect x="88" y="360" width="424" height="6" fill="#818cf8"/>
      <path d="M240 402v18m0 0-24 24m24-24 24 24M216 444v22h48v-22" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="240" cy="398" r="8" fill="#06b6d4"/>
      <circle cx="216" cy="446" r="8" fill="#06b6d4"/>
      <circle cx="264" cy="446" r="8" fill="#06b6d4"/>
      <text x="120" y="533" fill="#818cf8" class="mono" font-size="21" letter-spacing="2">RULES-BASED</text>
      <text x="120" y="578" fill="#ffffff" class="body" font-size="22">People define explicit</text>
      <text x="120" y="612" fill="#ffffff" class="body" font-size="22">if/then logic; clear for</text>
      <text x="120" y="646" fill="#ffffff" class="body" font-size="22">stable rules, brittle at scale.</text>
    </g>

    <g aria-label="Machine learning">
      <rect x="528" y="360" width="424" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
      <rect x="528" y="360" width="424" height="6" fill="#06b6d4"/>
      <path d="M680 412 656 438l24 14 24-14-24-26Zm-24 26-23 16m47-2v27m24-41 23 16" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="680" cy="412" r="8" fill="#818cf8"/>
      <circle cx="656" cy="438" r="8" fill="#818cf8"/>
      <circle cx="704" cy="438" r="8" fill="#818cf8"/>
      <circle cx="633" cy="454" r="8" fill="#06b6d4"/>
      <circle cx="680" cy="493" r="8" fill="#06b6d4"/>
      <circle cx="727" cy="454" r="8" fill="#06b6d4"/>
      <text x="560" y="533" fill="#06b6d4" class="mono" font-size="21" letter-spacing="2">MACHINE LEARNING</text>
      <text x="560" y="578" fill="#ffffff" class="body" font-size="22">Learns patterns from data</text>
      <text x="560" y="612" fill="#ffffff" class="body" font-size="22">to predict or group new cases,</text>
      <text x="560" y="646" fill="#ffffff" class="body" font-size="22">such as spam or demand.</text>
    </g>

    <g aria-label="Deep learning" style="display:none">
      <rect x="968" y="360" width="424" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
      <rect x="968" y="360" width="424" height="6" fill="#818cf8"/>
      <path d="M1160 402v70m-34-54 34 19 34-19m-68 35 34-17 34 17m-68 0 34 17 34-17" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1160" cy="402" r="8" fill="#06b6d4"/>
      <circle cx="1126" cy="418" r="8" fill="#06b6d4"/>
      <circle cx="1194" cy="418" r="8" fill="#06b6d4"/>
      <circle cx="1160" cy="437" r="8" fill="#06b6d4"/>
      <circle cx="1126" cy="453" r="8" fill="#06b6d4"/>
      <circle cx="1194" cy="453" r="8" fill="#06b6d4"/>
      <circle cx="1160" cy="472" r="8" fill="#06b6d4"/>
      <text x="1000" y="533" fill="#818cf8" class="mono" font-size="21" letter-spacing="2">DEEP LEARNING</text>
      <text x="1000" y="578" fill="#ffffff" class="body" font-size="22">Many network layers learn</text>
      <text x="1000" y="612" fill="#ffffff" class="body" font-size="22">useful features for images,</text>
      <text x="1000" y="646" fill="#ffffff" class="body" font-size="22">speech, and complex data.</text>
    </g>

    <g aria-label="Generative AI" style="display:none">
      <rect x="1408" y="360" width="424" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
      <rect x="1408" y="360" width="424" height="6" fill="#06b6d4"/>
      <path d="m1619 399 8 25 25 8-25 8-8 25-8-25-25-8 25-8 8-25Z" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linejoin="round"/>
      <path d="m1570 432 4 12 12 4-12 4-4 12-4-12-12-4 12-4 4-12Zm98 17 4 12 12 4-12 4-4 12-4-12-12-4 12-4 4-12Z" fill="#818cf8"/>
      <text x="1440" y="533" fill="#06b6d4" class="mono" font-size="21" letter-spacing="2">GENERATIVE AI</text>
      <text x="1440" y="578" fill="#ffffff" class="body" font-size="22">Learns patterns to generate</text>
      <text x="1440" y="612" fill="#ffffff" class="body" font-size="22">text, images, audio, or code.</text>
      <text x="1440" y="646" fill="#ffffff" class="body" font-size="22">Outputs vary; verify key facts.</text>
    </g>

    <text x="88" y="961" fill="#818cf8" class="mono" font-size="16">SOURCE</text>
