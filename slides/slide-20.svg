<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">What is Microsoft Agent Framework?</title>
  <desc id="description">Microsoft Agent Framework combines agents, harness agents, workflows, and integrations to build production-grade applications.</desc>
