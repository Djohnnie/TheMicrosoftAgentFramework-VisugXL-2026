    </style>
  </defs>
  <rect width="1920" height="1080" fill="#0b1020"/>
  <rect width="1920" height="1080" fill="url(#visug-glow-indigo)"/>
  <rect width="1920" height="1080" fill="url(#visug-glow-cyan)"/>
  <rect width="1920" height="1080" fill="url(#visug-glow-green)"/>
  <rect x="0" y="0" width="14" height="1080" fill="url(#visug-bar)"/>

  <text x="88" y="86" fill="#818cf8" class="mono" font-size="30" letter-spacing="3"><tspan fill="#06b6d4">&gt;&gt;</tspan> THE AGENT FRAMEWORK</text>
  <svg x="1676" y="53" width="156" height="39.796" viewBox="0 0 98 25" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="color:#ffffff"><g clip-path="url(#clip0_6865_14026)">
        <mask id="mask0_6865_14026" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="0" y="0" width="98" height="25">
        <path d="M97.7195 0.5H0.279297V24.5H97.7195V0.5Z" fill="white"></path>
        </mask>
        <g mask="url(#mask0_6865_14026)">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M7.88759 0.5H40.4611L36.3204 15.9534C36.0933 16.8002 36.8757 17.4876 37.944 17.4876C39.0123 17.4876 39.9643 16.8002 40.1914 15.9534L44.3326 0.5H53.1805L49.0397 15.9534C47.7758 20.6702 44.0182 24.5 37.2414 24.5C30.4647 24.5 26.2092 20.6707 27.4731 15.9534L31.6138 0.5L13.7895 15.4561H26.2823L23.9922 24.0027H0.280273L18.1045 9.04661H5.59803L7.88759 0.5ZM91.4228 24.0027H72.6212L78.9183 0.5H97.72L96.0024 6.90996H86.0486L85.4761 9.04661H94.324L92.6064 15.4566H83.7586L83.1861 17.5932H93.1398L91.4223 24.0032L91.4228 24.0027ZM67.9475 0.5C72.831 0.5 75.4832 5.39764 74.2193 10.1149C73.5096 12.7631 71.7159 14.7946 69.4152 16.0672L72.6212 24.0027H62.9727L61.2551 17.5927H59.4969L57.7794 24.0027H48.9315L55.2287 0.5H67.9475ZM64.0182 6.90996C65.2389 6.90996 65.9734 7.86754 65.6575 9.04661C65.3415 10.2257 64.0938 11.1833 62.8731 11.1833H61.214L62.359 6.90996H64.0182Z" fill="currentColor"></path>
