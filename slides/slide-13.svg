  <line x1="88" y1="120" x2="1832" y2="120" stroke="#2b3352" stroke-width="2"/>

  <g id="slide-content">
    <text x="88" y="235" fill="#ffffff" class="display" font-size="68">An LLM generates one token at a time</text>
    <text x="88" y="300" fill="#b6bccd" class="body" font-size="26">It predicts and appends a continuation, repeating the process until it stops.</text>

    <g aria-label="Agents" style="display:none">
      <rect x="88" y="360" width="424" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
      <rect x="88" y="360" width="424" height="6" fill="#818cf8"/>
      <path d="M269 443H329M299 413V473" stroke="#818cf8" stroke-width="5" stroke-linecap="round"/>
      <circle cx="299" cy="443" r="23" fill="#0b1020" stroke="#818cf8" stroke-width="5"/>
      <circle cx="259" cy="443" r="9" fill="#06b6d4"/><circle cx="339" cy="443" r="9" fill="#06b6d4"/>
      <circle cx="299" cy="403" r="9" fill="#06b6d4"/><circle cx="299" cy="483" r="9" fill="#06b6d4"/>
      <text x="120" y="533" fill="#818cf8" class="mono" font-size="21" letter-spacing="2">AGENTS</text>
      <text x="120" y="578" fill="#ffffff" class="body" font-size="22">Use models to process requests,</text>
      <text x="120" y="612" fill="#ffffff" class="body" font-size="22">call tools or MCP servers,</text>
      <text x="120" y="646" fill="#ffffff" class="body" font-size="22">and respond.</text>
    </g>

    <g aria-label="Harness agent" style="display:none">
      <rect x="528" y="360" width="424" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
      <rect x="528" y="360" width="424" height="6" fill="#06b6d4"/>
      <rect x="675" y="411" width="90" height="60" rx="5" fill="#0b1020" stroke="#06b6d4" stroke-width="4"/>
      <rect x="693" y="429" width="90" height="60" rx="5" fill="#0b1020" stroke="#818cf8" stroke-width="4"/>
      <path d="M721 458l12 12 23-27" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="560" y="533" fill="#06b6d4" class="mono" font-size="21" letter-spacing="2">HARNESS AGENT</text>
      <text x="560" y="578" fill="#ffffff" class="body" font-size="22">Support long tasks with</text>
      <text x="560" y="612" fill="#ffffff" class="body" font-size="22">planning, memory, file access,</text>
      <text x="560" y="646" fill="#ffffff" class="body" font-size="22">and approvals.</text>
    </g>

    <g aria-label="Workflows" style="display:none">
      <rect x="968" y="360" width="424" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
      <rect x="968" y="360" width="424" height="6" fill="#818cf8"/>
      <path d="M1055 443h48l22-26h54l22 26h48" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1055" cy="443" r="10" fill="#06b6d4"/><circle cx="1125" cy="443" r="10" fill="#06b6d4"/>
      <circle cx="1179" cy="417" r="10" fill="#06b6d4"/><circle cx="1245" cy="443" r="10" fill="#06b6d4"/>
      <path d="M1232 431l13 12-13 12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1000" y="533" fill="#818cf8" class="mono" font-size="21" letter-spacing="2">WORKFLOWS</text>
      <text x="1000" y="578" fill="#ffffff" class="body" font-size="22">Connect agents and functions</text>
      <text x="1000" y="612" fill="#ffffff" class="body" font-size="22">through explicit execution</text>
      <text x="1000" y="646" fill="#ffffff" class="body" font-size="22">paths.</text>
    </g>

    <g aria-label="Integrations" style="display:none">
      <rect x="1408" y="360" width="424" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
      <rect x="1408" y="360" width="424" height="6" fill="#06b6d4"/>
      <path d="M1619 443h-42m42 0h42m-42 0v-34m0 34v34" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1619" cy="443" r="20" fill="#0b1020" stroke="#818cf8" stroke-width="5"/>
      <circle cx="1567" cy="443" r="10" fill="#06b6d4"/><circle cx="1671" cy="443" r="10" fill="#06b6d4"/>
      <circle cx="1619" cy="399" r="10" fill="#06b6d4"/><circle cx="1619" cy="487" r="10" fill="#06b6d4"/>
      <text x="1440" y="533" fill="#06b6d4" class="mono" font-size="21" letter-spacing="2">INTEGRATIONS</text>
      <text x="1440" y="578" fill="#ffffff" class="body" font-size="22">Connect model providers,</text>
      <text x="1440" y="612" fill="#ffffff" class="body" font-size="22">tools, context, middleware,</text>
      <text x="1440" y="646" fill="#ffffff" class="body" font-size="22">evaluation, and UI.</text>
    </g>

    <g aria-label="Supported languages" style="display:none">
      <line x1="88" y1="744" x2="1832" y2="744" stroke="#2b3352" stroke-width="2"/>
      <text x="88" y="808" fill="#818cf8" class="display" font-size="34">Build in .NET, Python and Go (preview).</text>
      <text x="88" y="854" fill="#ffffff" class="body" font-size="24">Choose your model provider, then add state, middleware, and observability as your app grows.</text>
    </g>
    <g aria-label="LLM generation process">
      <g aria-label="Input">
        <rect x="88" y="360" width="320" height="310" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
        <rect x="88" y="360" width="320" height="6" fill="#818cf8"/>
        <path d="M218 396h42l20 20v42h-62zM260 396v22h20m-48 3h28m-28 14h28" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="112" y="520" fill="#818cf8" class="mono" font-size="19" letter-spacing="1.5">1 / INPUT</text>
        <text x="112" y="566" fill="#ffffff" class="body" font-size="20">Prompt and context</text>
        <text x="112" y="598" fill="#ffffff" class="body" font-size="20">enter the model.</text>
      </g>
      <g aria-label="Tokenization">
        <rect x="440" y="360" width="320" height="310" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
        <rect x="440" y="360" width="320" height="6" fill="#06b6d4"/>
        <rect x="540" y="416" width="42" height="34" rx="4" fill="none" stroke="#06b6d4" stroke-width="4"/>
        <rect x="588" y="416" width="42" height="34" rx="4" fill="none" stroke="#818cf8" stroke-width="4"/>
        <rect x="636" y="416" width="42" height="34" rx="4" fill="none" stroke="#06b6d4" stroke-width="4"/>
        <text x="464" y="520" fill="#06b6d4" class="mono" font-size="19" letter-spacing="1.5">2 / TOKENIZE</text>
        <text x="464" y="566" fill="#ffffff" class="body" font-size="20">Tokenizer maps text</text>
        <text x="464" y="598" fill="#ffffff" class="body" font-size="20">to token IDs.</text>
      </g>
      <g aria-label="Embeddings">
        <rect x="792" y="360" width="320" height="310" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
        <rect x="792" y="360" width="320" height="6" fill="#818cf8"/>
        <path d="m922 405 26-12 26 12v30l-26 12-26-12zm52 0 26-12 26 12v30l-26 12-26-12zm-52 30 26-12 26 12v30l-26 12-26-12zm52 0 26-12 26 12v30l-26 12-26-12z" fill="none" stroke="#818cf8" stroke-width="3" stroke-linejoin="round"/>
        <text x="816" y="520" fill="#818cf8" class="mono" font-size="19" letter-spacing="1.5">3 / EMBEDDINGS</text>
        <text x="816" y="566" fill="#ffffff" class="body" font-size="20">Token IDs map to</text>
        <text x="816" y="598" fill="#ffffff" class="body" font-size="20">vectors the model uses.</text>
      </g>
      <g aria-label="Next-token prediction">
        <rect x="1144" y="360" width="320" height="310" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
        <rect x="1144" y="360" width="320" height="6" fill="#06b6d4"/>
        <path d="M1244 456v-26m34 26v-45m34 45v-35m34 35v-60" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
        <path d="M1238 462h116" stroke="#b6bccd" stroke-width="3" stroke-linecap="round"/>
        <text x="1168" y="520" fill="#06b6d4" class="mono" font-size="18" letter-spacing="1">4 / PREDICT</text>
        <text x="1168" y="566" fill="#ffffff" class="body" font-size="20">Model scores possible</text>
        <text x="1168" y="598" fill="#ffffff" class="body" font-size="20">next-token choices.</text>
      </g>
      <g aria-label="Selection and append">
        <rect x="1496" y="360" width="320" height="310" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
        <rect x="1496" y="360" width="320" height="6" fill="#818cf8"/>
        <rect x="1577" y="418" width="34" height="34" rx="4" fill="none" stroke="#06b6d4" stroke-width="4"/>
        <rect x="1618" y="418" width="34" height="34" rx="4" fill="none" stroke="#06b6d4" stroke-width="4"/>
        <rect x="1659" y="418" width="34" height="34" rx="4" fill="#818cf8"/>
        <path d="M1704 435h24m-9-9 9 9-9 9" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="1520" y="520" fill="#818cf8" class="mono" font-size="18" letter-spacing="1">5 / SELECT &amp; APPEND</text>
        <text x="1520" y="566" fill="#ffffff" class="body" font-size="20">Select one token,</text>
        <text x="1520" y="598" fill="#ffffff" class="body" font-size="20">then append it.</text>
      </g>
      <text x="88" y="758" fill="#818cf8" class="display" font-size="31" style="display:none">Each token uses full context: prompt, history, injected context and response share one fixed window.</text>
      <text x="88" y="812" fill="#b6bccd" class="body" font-size="23" style="display:none">One full model pass per token makes longer replies slower; streaming delivers tokens as they arrive.</text>
    </g>
    <text x="88" y="961" fill="#818cf8" class="mono" font-size="16">SOURCE</text>
    <a href="https://learn.microsoft.com/en-us/agent-framework/journey/llm-fundamentals" target="_blank" rel="noopener noreferrer">
      <text x="164" y="961" fill="#b6bccd" class="mono" font-size="16">https://learn.microsoft.com/en-us/agent-framework/journey/llm-fundamentals</text>
    </a>
  </g>

