  <line x1="88" y1="120" x2="1832" y2="120" stroke="#2b3352" stroke-width="2"/>

  <g id="slide-content">
    <text x="88" y="235" fill="#ffffff" class="display" font-size="68">Simple Chatbot</text>
    <text x="88" y="300" fill="#b6bccd" class="body" font-size="26">Connect a cloud model through a common .NET chat interface.</text>

    <g aria-label="Example 02 steps">
      <g aria-label="AZURE OPENAI">
        <rect x="88" y="360" width="528" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
        <rect x="88" y="360" width="528" height="6" fill="#818cf8"/>
        <path d="M324 402v62m-27-35h54m-47-20 40 40m0-40-40 40" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
        <circle cx="324" cy="433" r="10" fill="#06b6d4"/>
        <text x="120" y="520" fill="#818cf8" class="mono" font-size="21" letter-spacing="1.5">1 / AZURE OPENAI</text>
        <text x="120" y="566" fill="#ffffff" class="body" font-size="20">Connect to Azure OpenAI in Foundry.</text>
        <text x="120" y="610" fill="#ffffff" class="body" font-size="20">Use the endpoint and API-key credential.</text>
        <text x="120" y="654" fill="#ffffff" class="body" font-size="20">Select your deployed model.</text>
      </g>
      <g aria-label="ICHATCLIENT">
        <rect x="696" y="360" width="528" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
        <rect x="696" y="360" width="528" height="6" fill="#06b6d4"/>
        <rect x="920" y="404" width="80" height="56" rx="5" fill="none" stroke="#06b6d4" stroke-width="4"/>
        <path d="m943 420 18 12-18 12m26 0h14" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="728" y="520" fill="#06b6d4" class="mono" font-size="21" letter-spacing="1.5">2 / ICHATCLIENT</text>
        <text x="728" y="566" fill="#ffffff" class="body" font-size="20">Adapt ResponsesClient with AsIChatClient.</text>
        <text x="728" y="610" fill="#ffffff" class="body" font-size="20">Program against the IChatClient interface.</text>
        <text x="728" y="654" fill="#ffffff" class="body" font-size="20">Keep provider details out of the chat loop.</text>
      </g>
      <g aria-label="GETRESPONSEASYNC">
        <rect x="1304" y="360" width="528" height="326" rx="8" fill="#161c33" stroke="#2b3352" stroke-width="2"/>
        <rect x="1304" y="360" width="528" height="6" fill="#818cf8"/>
        <path d="M1528 406a30 30 0 1 1-21 9m-8-9v18h18m11 0v-18m-9 9 9 9 9-9" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="1336" y="520" fill="#818cf8" class="mono" font-size="21" letter-spacing="1.5">3 / GETRESPONSEASYNC</text>
        <text x="1336" y="566" fill="#ffffff" class="body" font-size="20">Pass the user prompt to GetResponseAsync.</text>
        <text x="1336" y="610" fill="#ffffff" class="body" font-size="20">Await the response and read response.Text.</text>
        <text x="1336" y="654" fill="#ffffff" class="body" font-size="20">Each call is independent: no chat history.</text>
      </g>
      <text x="88" y="758" fill="#818cf8" class="mono" font-size="18" letter-spacing="2">SOURCE CODE</text>
      <text x="88" y="798" fill="#ffffff" class="body" font-size="25">examples\example-02</text>
    </g>
